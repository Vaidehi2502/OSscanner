server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors CRA's dev-server "proxy" field, but pointed at the backend
    # container's service name instead of localhost:5000.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routing fallback (single-page app).
    location / {
        try_files $uri /index.html;
    }
}
